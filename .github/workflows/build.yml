name: Build OkaWiFi tweak

# 零 Theos 构建：xcrun clang 直接编 dylib → codesign 自签 → devkit/mkdeb.sh 拼 deb。
#
# 为什么不用 Theos：
#   实测 Setup Theos（clone 主仓库 + 全部 submodule + 下载 SDK）约 680 秒，
#   而本工程没有任何 %hook / Logos 语法，全是运行时 hook，不需要 logos.pl，
#   也不需要 theos 的 makefile 体系。整套 Theos 只为跑一次 dpkg-deb 不值得。
#   零 Theos 全流程约 20 秒。devkit/build.sh 里有详细说明。
#
# 三个变体各自独立编译（不同 CPU 切片 + 不同 Architecture 字段 + 不同装包路径）：
#   rootful   iphoneos-arm     arm64        /Library/MobileSubstrate/...
#   rootless  iphoneos-arm64   arm64        /var/jb/Library/MobileSubstrate/...
#   roothide  iphoneos-arm64e  arm64e       /Library/MobileSubstrate/...（jbroot 内）
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（留空用默认）"
        required: false
        default: ""

env:
  # 版本号单一来源，禁止在别处硬编码（否则会出现「包名 v1.0、内容 v1.1」）。
  VERSION: ${{ github.event.inputs.version || '1.0.0' }}
  HOMEBREW_NO_AUTO_UPDATE: 1

jobs:
  build:
    name: ${{ matrix.scheme }}
    runs-on: macos-latest
    strategy:
      fail-fast: false     # 一个变体失败不影响其它变体，便于定位
      matrix:
        include:
          - scheme: rootful
            arch: iphoneos-arm
            cpu: arm64
          - scheme: rootless
            arch: iphoneos-arm64
            cpu: arm64
          - scheme: roothide
            arch: iphoneos-arm64e
            cpu: arm64e

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          set -eu
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version
          clang --version | head -2

      - name: Build ${{ matrix.scheme }}
        run: |
          set -eu
          sh devkit/build.sh "${{ matrix.cpu }}" "${{ matrix.arch }}" "$VERSION"

      # 产物校验：不只看"文件生成了"，要看 deb 内部结构真的对。
      - name: Verify deb
        run: |
          set -eu
          DEB=$(ls .build/out/*.deb | head -1)
          echo "deb: $DEB"
          ls -l "$DEB"

          # 1) Architecture 字段必须与预期一致，否则用户机器上装不上
          ARCH=$(python3 - "$DEB" <<'PY'
          import sys, tarfile, gzip, io
          raw = open(sys.argv[1], 'rb').read()
          # ar 归档：全局头 8 字节，然后每个成员 60 字节头
          off = 8
          while off + 60 <= len(raw):
              hdr = raw[off:off+60]
              name = hdr[0:16].decode().strip()
              size = int(hdr[48:58].decode().strip())
              body = raw[off+60:off+60+size]
              if name.startswith('control.tar'):
                  tf = tarfile.open(fileobj=io.BytesIO(gzip.decompress(body)))
                  ctl = tf.extractfile('./control').read().decode()
                  for line in ctl.splitlines():
                      if line.startswith('Architecture:'):
                          print(line.split(':', 1)[1].strip())
                          sys.exit(0)
              off += 60 + size + (size % 2)
          sys.exit(1)
          PY
          )
          echo "Architecture = $ARCH (expect ${{ matrix.arch }})"
          if [ "$ARCH" != "${{ matrix.arch }}" ]; then
            echo "::error::Architecture mismatch: got '$ARCH', want '${{ matrix.arch }}'"
            exit 1
          fi

          # 2) 载荷路径必须符合该 scheme
          if [ "${{ matrix.scheme }}" = "rootless" ]; then
            EXPECT_PATH="./var/jb/Library/MobileSubstrate/DynamicLibraries/OkaWiFi.dylib"
          else
            EXPECT_PATH="./Library/MobileSubstrate/DynamicLibraries/OkaWiFi.dylib"
          fi
          echo "expect payload: $EXPECT_PATH"
          python3 - "$DEB" "$EXPECT_PATH" <<'PY'
          import sys, tarfile, gzip, lzma, io
          deb, want = sys.argv[1], sys.argv[2]
          raw = open(deb, 'rb').read()
          off = 8
          names = []
          while off + 60 <= len(raw):
              hdr = raw[off:off+60]
              name = hdr[0:16].decode().strip()
              size = int(hdr[48:58].decode().strip())
              body = raw[off+60:off+60+size]
              if name.startswith('data.tar'):
                  if name.endswith('.xz'):
                      blob = lzma.decompress(body)
                  elif name.endswith('.gz'):
                      blob = gzip.decompress(body)
                  else:
                      blob = body
                  tf = tarfile.open(fileobj=io.BytesIO(blob))
                  names = [m.name for m in tf.getmembers()]
              off += 60 + size + (size % 2)
          for n in names:
              print('   ', n)
          if want not in names:
              print('::error::data.tar 里没有 %s' % want); sys.exit(1)
          if './DEBIAN/postinst' in names:
              print('::error::DEBIAN 混进了 data.tar（rootless 上会整个包装不上）'); sys.exit(1)
          print('  ✓ 载荷路径正确')
          PY

          # 3) dylib 必须是目标 CPU 切片（arch 不对 → 装了不加载）
          rm -rf .verify && mkdir -p .verify
          python3 - "$DEB" <<'PY'
          import sys, tarfile, lzma, gzip, io
          raw = open(sys.argv[1], 'rb').read()
          off = 8
          while off + 60 <= len(raw):
              hdr = raw[off:off+60]
              name = hdr[0:16].decode().strip()
              size = int(hdr[48:58].decode().strip())
              body = raw[off+60:off+60+size]
              if name.startswith('data.tar'):
                  # 按扩展名选解压器，别写死 lzma：mkdeb.sh 哪天改成 .gz 就会崩在这里
                  if name.endswith('.xz'):
                      blob = lzma.decompress(body)
                  elif name.endswith('.gz'):
                      blob = gzip.decompress(body)
                  else:
                      blob = body
                  tf = tarfile.open(fileobj=io.BytesIO(blob))
                  for m in tf.getmembers():
                      if m.name.endswith('OkaWiFi.dylib'):
                          open('.verify/OkaWiFi.dylib','wb').write(tf.extractfile(m).read())
                          sys.exit(0)
              off += 60 + size + (size % 2)
          sys.exit(1)
          PY
          xcrun lipo -info .verify/OkaWiFi.dylib
          xcrun lipo -info .verify/OkaWiFi.dylib | grep -q "${{ matrix.cpu }}" \
            || { echo "::error::dylib 缺 ${{ matrix.cpu }} 切片"; exit 1; }

          # 4) 签名必须存在（无 LC_CODE_SIGNATURE 的 dylib 会被 ellekit 跳过）
          xcrun codesign -dv .verify/OkaWiFi.dylib 2>&1 | head -5 || true
          xcrun otool -l .verify/OkaWiFi.dylib | grep -q LC_CODE_SIGNATURE \
            || { echo "::error::dylib 没有 LC_CODE_SIGNATURE，装上去不会被加载"; exit 1; }
          echo "✓ deb 校验全部通过"

      - name: Report packages
        run: |
          set -eu
          echo "--- 产物 ---"
          ls -l .build/out/*.deb
          for f in .build/out/*.deb; do
            echo ""
            echo "== $(basename "$f") =="
            echo "size   : $(wc -c < "$f")"
            echo "sha256 : $(shasum -a 256 "$f" | cut -d' ' -f1)"
          done

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: OkaWiFi-${{ matrix.scheme }}-${{ env.VERSION }}
          path: .build/out/*.deb
          if-no-files-found: error
          retention-days: 30