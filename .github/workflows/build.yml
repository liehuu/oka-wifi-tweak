name: Build OkaWiFi tweak

# 三个包体方案并行构建，每个任务一个干净的 macOS runner。
# 用 matrix 而不是"一个 job 里顺序编译三次"，原因：
#   1) roothide 用的是 roothide/theos 仓库，rootful/rootless 用 theos/theos，
#      共享 $HOME/theos 会串味；
#   2) .theos/ 里缓存着上一次的 ARCHS 和 install prefix，混编会出诡异产物。
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      scheme:
        description: "只构建某个变体（留空=全部）"
        required: false
        default: ""
        type: choice
        options: [ "", rootful, rootless, roothide ]

jobs:
  # 先算出要构建哪些变体，免得手改两处
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: bash
        run: |
          set -euo pipefail
          # $GITHUB_OUTPUT 的 key=value 只能是单行，多行 JSON 会被截断成
          # "Invalid format" 报错。所以这里用 python 一次性生成压缩后的单行 JSON。
          WANT="${{ github.event.inputs.scheme }}"
          python3 - "$WANT" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          want = sys.argv[1] if len(sys.argv) > 1 else ""
          all_variants = [
              {"scheme": "rootful",  "theos_repo": "https://github.com/theos/theos.git",    "arch": "iphoneos-arm"},
              {"scheme": "rootless", "theos_repo": "https://github.com/theos/theos.git",    "arch": "iphoneos-arm64"},
              {"scheme": "roothide", "theos_repo": "https://github.com/roothide/theos.git", "arch": "iphoneos-arm64e"},
          ]
          picked = [v for v in all_variants if v["scheme"] == want] if want else all_variants
          if not picked:
              picked = all_variants
          print("matrix=" + json.dumps({"include": picked}, separators=(",", ":")))
          PY
          grep '^matrix=' "$GITHUB_OUTPUT" | head -c 400; echo

  build:
    needs: plan
    name: ${{ matrix.scheme }}
    # 不用 macos-14：该标签在本仓库被解析为 macos-14-arm64-us-default，
    # 报 "configuration not supported" 直接 cancelled（job 无任何日志）。
    # macos-latest 走的是 x86_64 runner，公网免费额度下最稳。
    runs-on: macos-latest
    strategy:
      fail-fast: false          # 一个变体失败不影响其它变体，便于定位
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail
          brew install ldid dpkg make xz
          # dm.pl 依赖 xz；dpkg 提供 dpkg-deb 用于校验产物

      # theos 官方安装脚本还会装依赖和 SDK，但它会往 ~/.bash_profile 写 export，
      # 且部分分支需要交互。CI 里直接 clone + 显式 install-sdk 更可控。
      - name: Install Theos (${{ matrix.scheme }})
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          rm -rf "$THEOS"

          # 注意：--recursive 配 --depth 1 时 submodule 会留空目录，
          # 表现为 vendor/lib 里没有 libsubstrate.tbd，链接阶段才炸。
          # 所以分两步，显式 --init --recursive 拉 submodule。
          git clone --depth 1 "${{ matrix.theos_repo }}" "$THEOS"
          git -C "$THEOS" submodule update --init --recursive --depth 1 --jobs 8

          # submodule 到底有没有拉下来，这里就要判定，不能等到链接
          test -f "$THEOS/vendor/lib/libsubstrate.tbd" \
            || { echo "::error::vendor/lib/libsubstrate.tbd 缺失，submodule 未拉全"; ls -la "$THEOS/vendor/"; exit 1; }

          # SDK 是 Release 附件，单独下载
          "$THEOS/bin/install-sdk" latest

          ls "$THEOS/sdks/"
          {
            echo "THEOS=$THEOS"
            echo "THEOS_MAKE_PATH=$THEOS/makefiles"
          } >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: Build ${{ matrix.scheme }}
        run: |
          set -euo pipefail
          # rootful 不能传 THEOS_PACKAGE_SCHEME，否则 theos 报
          # "'rootful' package scheme does not exist"（modules 目录里没有 rootful 模块）
          if [ "${{ matrix.scheme }}" = "rootful" ]; then
            export THEOS_PACKAGE_SCHEME=""
          else
            export THEOS_PACKAGE_SCHEME="${{ matrix.scheme }}"
          fi
          echo "== THEOS_PACKAGE_SCHEME='${THEOS_PACKAGE_SCHEME}' =="

          make clean 2>/dev/null || true
          make package FINALPACKAGE=1 -j"$(sysctl -n hw.ncpu)"

          echo "== packages =="
          ls -la packages/

      - name: Verify deb
        run: |
          set -euo pipefail
          DEB=$(ls packages/*.deb | head -1)
          echo "deb: $DEB"
          dpkg-deb -I "$DEB"
          echo "--- payload tree ---"
          dpkg-deb -c "$DEB"

          # 硬校验 1：Architecture 必须与预期一致，否则用户机器上装不上
          ARCH=$(dpkg-deb -f "$DEB" Architecture)
          echo "Architecture = $ARCH (expect ${{ matrix.arch }})"
          if [ "$ARCH" != "${{ matrix.arch }}" ]; then
            echo "::error::Architecture mismatch: got '$ARCH', want '${{ matrix.arch }}'"
            exit 1
          fi

          # 硬校验 2：dylib 和 filter plist 必须都在 deb 里，且路径符合该 scheme
          LIST=$(dpkg-deb -c "$DEB")
          echo "$LIST" | grep -q "OkaWiFi.dylib" \
            || { echo "::error::deb 里没有 OkaWiFi.dylib"; exit 1; }
          echo "$LIST" | grep -q "OkaWiFi.plist" \
            || { echo "::error::deb 里没有 filter plist"; exit 1; }

          if [ "${{ matrix.scheme }}" = "rootless" ]; then
            echo "$LIST" | grep -q "\./var/jb/Library/MobileSubstrate/DynamicLibraries/OkaWiFi.dylib" \
              || { echo "::error::rootless 包路径不对，应为 /var/jb/..."; exit 1; }
          else
            echo "$LIST" | grep -q "\./Library/MobileSubstrate/DynamicLibraries/OkaWiFi.dylib" \
              || { echo "::error::包路径不对，应为 /Library/MobileSubstrate/..."; exit 1; }
          fi

          # 硬校验 3：dylib 必须是 arm64 + arm64e 双切片
          # （RootHide/arm64e 设备上缺 arm64e 切片会直接不加载）
          mkdir -p /tmp/x && rm -rf /tmp/x/* && dpkg-deb -x "$DEB" /tmp/x
          DYLIB=$(find /tmp/x -name OkaWiFi.dylib | head -1)
          echo "dylib: $DYLIB"
          lipo -info "$DYLIB"

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: OkaWiFi-${{ matrix.scheme }}
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildlog-${{ matrix.scheme }}
          path: |
            .theos/
            packages/
          if-no-files-found: ignore
          retention-days: 7