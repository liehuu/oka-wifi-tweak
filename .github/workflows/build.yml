name: Build OkaWiFi tweak

# 零 Theos 构建：xcrun clang 直接编 dylib → codesign 自签 → devkit/mkdeb.sh 拼 deb。
#
# 为什么不用 Theos：
#   实测 Setup Theos（clone 主仓库 + 全部 submodule + 下载 SDK）约 680 秒，
#   而本工程没有任何 %hook / Logos 语法，全是运行时 hook，不需要 logos.pl，
#   也不需要 theos 的 makefile 体系。整套 Theos 只为跑一次 dpkg-deb 不值得。
#   零 Theos 全流程约 20 秒。devkit/build.sh 里有详细说明。
#
# 三个变体各自独立编译（不同 CPU 切片 + 不同 Architecture 字段 + 不同装包路径）：
#   rootful   iphoneos-arm     arm64        /Library/MobileSubstrate/...
#   rootless  iphoneos-arm64   arm64        /var/jb/Library/MobileSubstrate/...
#   roothide  iphoneos-arm64e  arm64e       /Library/MobileSubstrate/...（jbroot 内）
on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（留空用默认）"
        required: false
        default: ""

env:
  # 版本号单一来源，禁止在别处硬编码（否则会出现「包名 v1.0、内容 v1.1」）。
  VERSION: ${{ github.event.inputs.version || '1.1.0' }}
  HOMEBREW_NO_AUTO_UPDATE: 1

jobs:
  build:
    name: ${{ matrix.scheme }}
    runs-on: macos-latest
    strategy:
      fail-fast: false     # 一个变体失败不影响其它变体，便于定位
      matrix:
        include:
          - scheme: rootful
            arch: iphoneos-arm
            cpu: arm64
          - scheme: rootless
            arch: iphoneos-arm64
            cpu: arm64
          - scheme: roothide
            arch: iphoneos-arm64e
            cpu: arm64e

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          set -eu
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version
          clang --version | head -2
          # bash 版本也是诊断信息：CI 是 3.2，本机是 5.x，
          # 两者变量名解析规则不同（见 devkit/check-shell.py 的说明）
          bash --version | head -1

      # 静态闸门：本机是 bash 5 / dash，跑不出 macOS bash 3.2 的问题，
      # 只能靠静态检查兜住。本次真实事故就是 $CPU 后跟全角逗号导致
      # "CPU: unbound variable"（编译和签名都成功了，卡在这一行）。
      - name: Shell compatibility gate (bash 3.2)
        run: |
          set -eu
          python3 devkit/check-shell.py .

      # 校验器自身的自测：证明 verify-deb.py 的判定**会失败**。
      # 一个从不失败的检查等于没有检查 —— 这条就是为了防这个。
      # 15 个用例（正向 3 / 反向 12）全部用代码里拼出来的 Mach-O 与 deb，
      # 不依赖 lipo/otool，因此在 macOS 与本地 Windows 上结果一致。
      - name: Verify-deb selftest
        run: |
          set -eu
          python3 devkit/selftest-verify.py

      # v1.1.0 前端资源闸门：
      #  · node --check 用真实 JS 解析器验语法（不是正则数括号）；
      #  · selftest-webassets.py 做反向注入，证明危险字面量闸门会失败；
      #  · 生成一次头文件，确认往返解码自检在 CI 环境同样通过。
      # runner 缺 node 时明确报错，不静默跳过（跳过即通过的下场见 1.0.2 的教训）。
      - name: Web assets gate
        run: |
          set -eu
          if ! command -v node >/dev/null 2>&1; then
            echo "::error::runner 缺 node，无法做 JS 语法闸门"
            exit 1
          fi
          node --check web/oka-wifi.js
          python3 devkit/selftest-webassets.py
          python3 devkit/gen-webassets.py web .build/OkaWebAssets.h

      - name: Build ${{ matrix.scheme }}
        run: |
          set -u
          # ★ 用 tee + PIPESTATUS 保留真实退出码：
          #   `sh build.sh | tee log` 的退出码是 tee 的（恒 0），构建失败会被吞掉。
          #   bash 才有 PIPESTATUS，所以这里显式用 bash 而不是 sh。
          bash devkit/build.sh "${{ matrix.cpu }}" "${{ matrix.arch }}" "$VERSION" 2>&1 \
            | tee build.log
          RC=${PIPESTATUS[0]:-$?}
          echo "build.sh exit=$RC"
          if [ "$RC" -ne 0 ]; then
            # ★ 必须逐行用 ::error:: 前缀输出，普通 echo 不会进 annotations，
            #   而 annotations 是唯一不展开日志也能看到的内容（上一版就栽在这）。
            echo "::group::build.log 尾部 60 行"
            tail -60 build.log || true
            echo "::endgroup::"

            grep -nE "error:|fatal error|✗|Failed" build.log | head -15 > errs.txt || true
            if [ -s errs.txt ]; then
              while IFS= read -r line; do
                echo "::error::${line//%/%%}"
              done < errs.txt
            else
              # 没有 error: 关键字说明卡在 shell 层（例如 set -u 触发的
              # unbound variable，或 [ -f ] 之类的检查），
              # 这种情况把最后几行原样抛出来。
              while IFS= read -r line; do
                echo "::error::[shell] ${line//%/%%}"
              done <<< "$(tail -8 build.log)"
            fi
            echo "::error::build.sh 退出码 $RC"
            exit "$RC"
          fi

      # 构建成功时也把编译警告列出来：warning 里常藏着真问题
      # （比如某个函数参数类型不匹配，现在能过、换 Xcode 版本就报错）。
      - name: Show warnings
        if: success()
        run: |
          grep -nE "warning:" build.log | head -40 || echo "（无警告）"

      # 产物校验：不只看"文件生成了"，要看 deb 内部结构真的对。
      #
      # ★★ 判据全部放在 devkit/verify-deb.py 里，这里只调一行。
      #   为什么不在 YAML 里内嵌 heredoc：YAML 的 run: | block scalar
      #   以「第一个非空行的缩进」为基准，内容顶格会让块立即结束（ScannerError）；
      #   而 Python heredoc 体又不能带缩进（IndentationError）。
      #   这两个要求互斥，无法在 YAML 里同时满足，只能外置成脚本。
      #   附带好处：本地能拿 .build/out/*.deb 直接跑，判据与 CI 完全一致。
      - name: Verify deb
        run: |
          set -eu
          DEB=$(ls .build/out/*.deb | head -1)
          echo "deb: $DEB"
          ls -l "$DEB"
          python3 devkit/verify-deb.py "$DEB" "${{ matrix.scheme }}" "${{ matrix.arch }}" \
            --expect-cpu "${{ matrix.cpu }}"

      - name: Report packages
        run: |
          set -eu
          echo "--- 产物 ---"
          ls -l .build/out/*.deb
          for f in .build/out/*.deb; do
            echo ""
            echo "== $(basename "$f") =="
            echo "size   : $(wc -c < "$f")"
            echo "sha256 : $(shasum -a 256 "$f" | cut -d' ' -f1)"
          done

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: OkaWiFi-${{ matrix.scheme }}-${{ env.VERSION }}
          path: .build/out/*.deb
          if-no-files-found: error
          retention-days: 30